<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AstralLink Gaming</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0908;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 92%;
            max-width: 420px;
            background: #1c1714;
            border: 1px solid #6b5133;
            border-radius: 25px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 0 35px rgba(218, 157, 65, 0.15);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #f1bd68;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .welcome {
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid #554333;
            background: #100e0d;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #e9ae55;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            margin-top: 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #f3c36f, #d99332);
            color: #17110b;
            font-size: 17px;
            font-weight: bold;
        }

        .register {
            margin-top: 25px;
            color: #aaa;
        }

        .register span {
            color: #f1b75c;
            font-weight: bold;
        }

        .note {
            margin-top: 25px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">◆ AstralLink</div>
        <div class="subtitle">Gaming Platform</div>

        <h1>Welcome Back</h1>

        <div class="welcome">
            Login to your account
        </div>

        <input
            type="text"
            placeholder="Username / Email"
        >

        <input
            type="password"
            placeholder="Password"
        >

        <button class="login-btn" onclick="loginUser()">
            LOGIN →
        </button>

        <div class="register">
            Don't have an account?
            <span>Register Now</span>
        </div>

        <div class="note">
            Demo gaming website
        </div>

    </div>
<script>
function loginUser() {
    const username = document.querySelector('input[type="text"]').value.trim();
    const password = document.querySelector('input[type="password"]').value.trim();

    if (username === "" || password === "") {
        alert("Please enter username and password");
        return;
    }

    window.location.href = "products.html";
}
</script>
</body>
  </html>
